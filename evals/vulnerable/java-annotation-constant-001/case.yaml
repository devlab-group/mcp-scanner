id: java-annotation-constant-001
category: tool_poisoning
notes: >
  A Spring AI tool whose description is a static final String constant in the same class,
  the usual way a long Java description is kept out of the annotation. The constant was
  not read before, which left the payload unanalyzed.
analyzers: []
target: {kind: source, path: src}
expected:
  vulnerable: true
  minimum_severity: high
  rules:
    - promptdefense.exfiltration
    - promptdefense.credential-harvesting
