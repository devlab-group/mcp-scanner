# mcp-scanner configuration for an active remote scan. The LLM analyzer remains
# disabled unless you uncomment its block below.
#
# Use it with:
#   mcp-scanner remote --config config.yaml --format json <url>
#
# --format has no configuration key, so it stays on the command line.

# Deliberately not listed. An empty selection means "every analyzer in this
# build that applies to the target", which is what enables all of them.
#
# Listing them by name would do the opposite of what it looks like: a named
# analyzer is required whatever it returns, so naming the ones that cannot run
# against a remote target - source, taint, behavioral, supplychain, runtime,
# and yara, which needs a build tag this binary does not have - would make every
# scan come back UNKNOWN at exit 3. Left empty, each of those excuses itself
# and the scan still completes.
# analyzers: []

# Invoke tools on the target, and allow any tool name.
#
# This permits tool calls but does not choose one. A tool is invoked only when
# analyzer_options.auth.identity_tool is also configured. Point it at a server
# whose side effects you accept.
active_probes: tool-calls
allow_tool_calls:
  - "*"

# Fetch what the server would actually hand a model, not just what it
# declares. A payload inside a resource body or a rendered prompt is the
# indirect form of prompt injection and is invisible without these. Both
# need an active-probe level of at least safe, which tool-calls satisfies.
read_resources: true
get_prompts: true

# Off by default on purpose: it lets the scanner reach loopback, link-local
# and private-range addresses, which is where a hostile server would most
# like to send it. Turn it on only to scan a server on your own machine or
# network.
allow_private_networks: false

# Optional analyzers can read keys from named environment variables without
# storing a secret in this file. Cisco and VirusTotal are not registered in the
# default build. To use them, add their packages to the analyzer registry and
# rebuild the scanner; there is no build flag that enables them.
#
# When registered, Cisco and VirusTotal skip themselves if the configured
# environment variable is unset.
# cisco:
#   api_key_env: CISCO_AI_DEFENSE_API_KEY
# virustotal:
#   api_key_env: VIRUSTOTAL_API_KEY
#   # Hash lookups only. Turning this on uploads files the service has never
#   # seen, which for a source or package target means sending somebody's
#   # code to a third party.
#   allow_upload: false

# llm is different from the two above: naming a provider here is the opt-in,
# and once opted in a missing key is an error rather than a skip - on
# purpose, because an analysis the operator asked for and did not get should
# not read as a clean scan. With this block present and ANTHROPIC_API_KEY
# unset, a scan with a declared MCP surface ends UNKNOWN at exit 3. If the
# snapshot has no declared surface, the analyzer skips instead.
#
# To enable this block, uncomment all four lines and set the key.
# llm:
#   provider: anthropic
#   model: claude-sonnet-5
#   api_key_env: ANTHROPIC_API_KEY
