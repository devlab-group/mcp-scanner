id: go-compact-params-001
category: command_injection
notes: >
  A helper uses Go's compact multi-name parameter form. Taint reaches the second
  parameter, so parameter discovery must record every name rather than only the first.
analyzers: []
target: {kind: source, path: src}
expected:
  vulnerable: true
  minimum_severity: high
  rules: [taint.command_injection]
