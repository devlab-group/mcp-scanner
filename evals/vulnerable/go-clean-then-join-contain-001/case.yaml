id: go-clean-then-join-contain-001
category: path_traversal
notes: >
  The argument is cleaned before it is joined to the root, leaving the combined path
  unnormalized. `filepath.Clean("../../etc/passwd")` still begins with `..`, so the
  prefixed full path passes the check but escapes during the read.
analyzers: []
target: {kind: source, path: src}
expected:
  vulnerable: true
  minimum_severity: high
  rules: [taint.path_traversal]
