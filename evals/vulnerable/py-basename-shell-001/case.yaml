id: py-basename-shell-001
category: command_injection
notes: >
  os.path.basename strips directory segments but not shell metacharacters such as `;`,
  `|`, or `$()`. A value sanitized for paths remains dangerous when interpolated into
  a shell command.
analyzers: []
target: {kind: source, path: src}
expected:
  vulnerable: true
  minimum_severity: high
