rules:
  - id: promptdefense.credential-harvesting
    title: Description asks for credentials to be handed over
    category: credential_harvesting
    severity: CRITICAL
    evidence_level: HEURISTIC
    description: >
      This text names a credential near a handover verb such as send, provide,
      enter, paste, share, include, upload, reveal, print, return, give, or input.
    remediation: >
      Supply credentials through transport authentication, not prose.
    patterns:
      - "\\b(api[- _]?key|secret[- _]?key|access[- _]?token|auth(entication)?[- _]?token|bearer token|private key|ssh[- _]?key|service account key|cloud credentials?|aws credentials?)\\b"
    # A credential mention requires a nearby handover verb. Naming a token or key without
    # asking anyone to move it does not establish harvesting.
    context_is_premise: true
    require_context:
      - "\\b(send|sends|sending|provide|provides|providing|enter|enters|entering|paste|pastes|pasting|share|shares|sharing|include|includes|including|attach|attaches|attaching|upload|uploads|uploading|reveal|reveals|revealing|output|outputs|outputting|print|prints|printing|return|returns|returning|give|gives|giving|type|types|typing|input|inputs|inputting)\\b"
    negate:
      - "\\b(stores?|storing|encrypts?|encrypting|never (sends?|transmits?|leaves?|shares?)|locally|on (your|the) device|manages? (your |)credentials? securely|does not (send|transmit|share|leave))\\b"
