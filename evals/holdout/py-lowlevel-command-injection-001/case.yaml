id: py-lowlevel-command-injection-001
category: command_injection
notes: >
  Held out of rule tuning. A low-level Python server lists tools with
  @app.list_tools() and dispatches them from @app.call_tool(). Its argument reaches
  os.popen through an f-string without using the usual @mcp.tool() decorator.
analyzers: []
target: {kind: source, path: src}
expected:
  vulnerable: true
  minimum_severity: high
  rules: [taint.command_injection]
