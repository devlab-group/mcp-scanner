id: npm-alias-lockfile-001
category: vulnerable_dependency
notes: >
  A lockfile v2/v3 entry installs an aliased npm package. The scanner must use the
  entry's name field instead of deriving a nonexistent OSV coordinate from its install
  path.
analyzers: [supplychain]
target: {kind: source, path: src}
expected:
  vulnerable: true
  minimum_severity: high
