name: dist

# Builds release binaries for every platform. The tree-sitter parsers need cgo, so each build
# needs a C compiler for its target: Linux and Windows cross-compile on one Ubuntu runner, and
# macOS builds on a macOS runner. A tag push also publishes the binaries as a GitHub Release; a
# manual run only uploads them as a workflow artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version stamp comes from git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64
      - run: make dist
      - run: make dist GOARCH=arm64 CC=aarch64-linux-gnu-gcc
      - run: make dist GOOS=windows CC=x86_64-w64-mingw32-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: dist/

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
      - run: make dist GOARCH=amd64 CC="clang -arch x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/

  checksums:
    needs: [linux-windows, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - run: cd dist && sha256sum mcp-scanner_* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
